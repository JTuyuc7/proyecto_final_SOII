events {}

http {
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # ⚠️ 🔓 Permitir validaciones de Let's Encrypt
        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            allow all;
        }

        # 🔒 Protege archivos ocultos como .env, .git, etc.
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 📁 Ruta principal del sitio
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
