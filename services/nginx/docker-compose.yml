services:
  web:
    image: nginx:latest
    container_name: nginx_web
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf   # ✅ Montar config personalizada
      #- /var/log/proyecto_so2/nginx/access.log:/var/log/nginx/access.log
      # - /var/log/proyecto_so2/nginx/error.log:/var/log/nginx/error.log
    # user: ${UID}:${GID}  # ✅ Ejecutar como el usuario actual
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env
    networks:
      - web  

networks:
  web:
    external: true